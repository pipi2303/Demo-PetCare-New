name: CI/CD - Build & Deploy petcare-demo

# Runs on every push to main:
#   1) build job installs deps, typechecks (tsc --noEmit) and builds the app
#      exactly like the Dockerfile does, so a broken commit is caught here
#      instead of failing the Portainer build on the VPS.
#   2) deploy job only runs if build succeeded, and simply calls the
#      Portainer stack webhook — that's what actually makes Portainer pull
#      the new commit and redeploy the petcare-demo stack (postgres + app).
#
# This intentionally does NOT SSH into the VPS or push a Docker image
# anywhere: Portainer's own "Managed by Git" + webhook feature already does
# the pull-and-rebuild step, so CI's only job is to gate that trigger behind
# a passing build.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Build (vite + esbuild server bundle)
        run: npm run build

  deploy:
    name: Trigger Portainer redeploy
    needs: build
    runs-on: ubuntu-latest
    # Only auto-deploy on an actual push to main, not on a manual
    # workflow_dispatch test run of the build job alone.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Call Portainer stack webhook
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::PORTAINER_WEBHOOK_URL secret is not set."
            exit 1
          fi
          # Retry up to 3x with 15s delay. HTTP 409 = Portainer already deploying;
          # wait and retry. Any other non-2xx fails immediately.
          for attempt in 1 2 3; do
            STATUS=$(curl --silent --show-error -k -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL")
            echo "Attempt $attempt: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "204" ]; then
              echo "Webhook accepted."
              exit 0
            elif [ "$STATUS" = "409" ]; then
              echo "Portainer busy (409), retrying in 15s..."
              sleep 15
            else
              echo "::error::Webhook failed with HTTP $STATUS"
              exit 1
            fi
          done
          echo "::warning::Portainer still busy after 3 attempts — deploy may be queued."
