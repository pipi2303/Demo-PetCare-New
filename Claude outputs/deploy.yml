name: CI/CD - Build & Deploy petcare-demo

# Runs on every push to main:
#   1) build job installs deps, typechecks (tsc --noEmit) and builds the app
#      exactly like the Dockerfile does, so a broken commit is caught here
#      instead of failing the Portainer build on the VPS.
#   2) deploy job only runs if build succeeded, and simply calls the
#      Portainer stack webhook — that's what actually makes Portainer pull
#      the new commit and redeploy the petcare-demo stack (postgres + app).
#
# This intentionally does NOT SSH into the VPS or push a Docker image
# anywhere: Portainer's own "Managed by Git" + webhook feature already does
# the pull-and-rebuild step, so CI's only job is to gate that trigger behind
# a passing build.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Build (vite + esbuild server bundle)
        run: npm run build

  deploy:
    name: Trigger Portainer redeploy
    needs: build
    runs-on: ubuntu-latest
    # Only auto-deploy on an actual push to main, not on a manual
    # workflow_dispatch test run of the build job alone.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Call Portainer stack webhook
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::PORTAINER_WEBHOOK_URL secret is not set. Add it in GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          # -k: skip TLS verification. Portainer here is reached over a
          # self-signed HTTPS certificate (common for an IP-based Portainer
          # install), so curl would otherwise refuse the connection with
          # "SSL certificate problem: self-signed certificate".
          curl --fail --silent --show-error -k -X POST "$WEBHOOK_URL"
