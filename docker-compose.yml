services:
  postgres:
    image: postgres:16-alpine
    container_name: petcares-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petcare}
      # No weak fallback for the password: if POSTGRES_PASSWORD isn't set as
      # a real environment variable on the stack, deployment now fails
      # loudly instead of silently starting with a guessable default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the stack's environment variables — no default is provided}
      POSTGRES_DB: ${POSTGRES_DB:-petcare}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petcare} -d ${POSTGRES_DB:-petcare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  petcares-demo:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: petcares-demo

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # Direct access fallback — keeps the app reachable while SSL certs are not
    # yet provisioned. Once nginx is running with valid certs, operators can
    # remove this port binding so all traffic routes through Nginx only.
    ports:
      - "3002:3000"

    volumes:
      - backups:/app/backups

    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3002}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3002}
      CLINIC_NAME: ${CLINIC_NAME:-PetCare ERP}
      DATABASE_URL: postgres://${POSTGRES_USER:-petcare}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the stack's environment variables — no default is provided}@postgres:5432/${POSTGRES_DB:-petcare}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      GMAIL_USER: ${GMAIL_USER}
      WA_TOKEN: ${WA_TOKEN}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      BACKUP_DIR: /app/backups
      BACKUP_RCLONE_DEST: ${BACKUP_RCLONE_DEST:-}

  # Nginx reverse proxy with HTTPS — only starts when profile 'https' is active.
  # Steps to enable:
  #   1. Place SSL certs in ./nginx/certs/fullchain.pem and privkey.pem
  #      (e.g. via: certbot certonly --standalone -d your-domain.com)
  #   2. Set APP_URL and FRONTEND_URL to your domain in Portainer env vars
  #   3. Start with: docker-compose --profile https up -d
  #   4. Remove the ports: block above from petcares-demo once verified
  nginx:
    image: nginx:1.27-alpine
    container_name: petcares-nginx
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      petcares-demo:
        condition: service_healthy

volumes:
  pgdata:
  backups:
